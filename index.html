<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#17212b" />
  <title>TG Cloud 240</title>
  <!-- TDLib WebAssembly Browser Bundle (for Full MTProto User Login) -->
  <script src="https://cdn.jsdelivr.net/npm/@sayyid2112/tdweb@1.8.45/dist/tdweb.js" defer></script>
  <style>
    :root {
      --bg-main: #0e1621;
      --bg-panel: #17212b;
      --bg-item: #1f2c3a;
      --bg-focus: #2b5278;
      --bg-msg-in: #182533;
      --bg-msg-out: #2b5278;
      --accent: #5288c1;
      --accent-bright: #64b5ef;
      --text-main: #f5f5f5;
      --text-muted: #8a9aa9;
      --danger: #e53935;
      --success: #4caf50;
      --border: #243447;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #05080c;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.25;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 240x320 Viewport Container (scales to 100% on actual 240x320 screen) */
    #app-shell {
      width: 240px;
      height: 320px;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    @media (max-width: 260px), (max-height: 340px) {
      #app-shell {
        width: 100vw;
        height: 100vh;
        border: none;
      }
    }

    /* Top Header Bar (24px) */
    #top-bar {
      height: 24px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      font-size: 11px;
      color: var(--accent-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.offline { background: #ff9800; }

    .top-meta {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Filter Tabs Bar (22px) */
    #tab-bar {
      height: 22px;
      background: var(--bg-panel);
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      font-size: 10px;
      line-height: 21px;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }

    .tab-btn.active {
      color: var(--accent-bright);
      border-bottom-color: var(--accent-bright);
      font-weight: 700;
    }

    /* Main Scrollable Content Area */
    #main-view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      position: relative;
    }

    #main-view::-webkit-scrollbar {
      width: 3px;
    }
    #main-view::-webkit-scrollbar-thumb {
      background: var(--accent);
    }

    /* Focusable Items (D-Pad Navigation) */
    .focusable {
      outline: none;
      cursor: pointer;
      transition: background 0.08s ease;
    }

    .focusable.focused, .focusable:focus {
      background: var(--bg-focus) !important;
      box-shadow: inset 3px 0 0 var(--accent-bright);
    }

    /* Chat List Item (42px height -> ~6 rows visible on 240x320) */
    .chat-row {
      display: flex;
      align-items: center;
      padding: 4px 6px;
      height: 44px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 6px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
    }

    .chat-title {
      font-weight: 600;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .chat-time {
      font-size: 9px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .chat-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
      gap: 4px;
    }

    .chat-preview {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .focusable.focused .chat-preview,
    .focusable.focused .chat-time {
      color: #d8eaff;
    }

    .badge {
      background: var(--accent-bright);
      color: #0e1621;
      font-weight: 700;
      font-size: 9px;
      padding: 0 5px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .type-tag {
      font-size: 8px;
      padding: 0 3px;
      border-radius: 2px;
      background: rgba(100, 181, 239, 0.2);
      color: var(--accent-bright);
      margin-right: 3px;
    }

    /* Message View */
    .msg-list {
      padding: 4px 5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-item {
      padding: 5px 6px;
      border-radius: 6px;
      background: var(--bg-msg-in);
      max-width: 92%;
      align-self: flex-start;
      border: 1px solid transparent;
      word-wrap: break-word;
    }

    .msg-item.out {
      background: var(--bg-msg-out);
      align-self: flex-end;
    }

    .msg-item.focused {
      border-color: #fff;
      box-shadow: 0 0 0 1px var(--accent-bright);
    }

    .msg-sender {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-bright);
      margin-bottom: 1px;
    }

    .msg-reply-box {
      border-left: 2px solid var(--accent-bright);
      padding-left: 4px;
      margin-bottom: 3px;
      font-size: 9px;
      color: #cfe6ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-media-box {
      background: rgba(0,0,0,0.25);
      border: 1px dashed var(--accent-bright);
      border-radius: 4px;
      padding: 4px;
      margin: 3px 0;
      font-size: 10px;
      color: #ffeb3b;
    }

    .msg-text {
      font-size: 11px;
      color: var(--text-main);
      user-select: text;
    }

    .msg-footer {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Bottom Composer in Chat */
    .composer-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .reply-banner {
      font-size: 9px;
      color: var(--accent-bright);
      background: rgba(82,136,193,0.15);
      padding: 2px 4px;
      border-radius: 3px;
      display: flex;
      justify-content: space-between;
    }

    .composer-row {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .input-field {
      flex: 1;
      background: var(--bg-main);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 5px;
      font-size: 11px;
      outline: none;
      width: 100%;
    }

    .input-field:focus, .input-field.focused {
      border-color: var(--accent-bright);
      background: #131f2e;
    }

    .mini-btn {
      background: var(--bg-item);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* Forms & Settings Views */
    .form-box {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 10px;
      color: var(--accent-bright);
      font-weight: 600;
    }

    .form-help {
      font-size: 9px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .btn-block {
      display: block;
      width: 100%;
      padding: 6px;
      text-align: center;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      margin-top: 2px;
    }

    .btn-block.secondary {
      background: var(--bg-item);
      border: 1px solid var(--border);
    }

    /* Popup Action Menu (Left Softkey / Message Menu) */
    #menu-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 24px;
      z-index: 50;
    }

    #menu-overlay.open {
      display: flex;
    }

    .menu-sheet {
      background: var(--bg-panel);
      border-top: 2px solid var(--accent-bright);
      max-height: 230px;
      overflow-y: auto;
    }

    .menu-header {
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-bright);
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border);
    }

    .menu-option {
      padding: 6px 8px;
      font-size: 11px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
    }

    .menu-key {
      font-size: 9px;
      color: var(--accent-bright);
      background: rgba(255,255,255,0.08);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* Toast Notification */
    #toast {
      position: absolute;
      top: 28px;
      left: 8px;
      right: 8px;
      background: #2b5278;
      color: #fff;
      border: 1px solid var(--accent-bright);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 10px;
      text-align: center;
      z-index: 100;
      display: none;
    }

    /* Feature Phone Softkey Bar (24px) */
    #softkey-bar {
      height: 24px;
      background: #090d14;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      z-index: 60;
    }

    .sk-left, .sk-right {
      color: var(--accent-bright);
      cursor: pointer;
      padding: 2px 4px;
    }

    .sk-center {
      color: #fff;
      background: var(--accent);
      padding: 1px 8px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- Top Header -->
    <div id="top-bar">
      <div class="brand">
        <span id="conn-dot" class="status-dot"></span>
        <span id="header-title">Telegram 240</span>
      </div>
      <div class="top-meta" id="header-meta">DEMO</div>
    </div>

    <!-- Category Filter Bar (Shown on Chat List) -->
    <div id="tab-bar">
      <div class="tab-btn active" data-tab="all" onclick="switchTab('all')">1:All</div>
      <div class="tab-btn" data-tab="private" onclick="switchTab('private')">2:Chats</div>
      <div class="tab-btn" data-tab="groups" onclick="switchTab('groups')">3:Grps</div>
      <div class="tab-btn" data-tab="channels" onclick="switchTab('channels')">4:Chan</div>
    </div>

    <!-- Toast Alert -->
    <div id="toast"></div>

    <!-- Main Dynamic Viewport -->
    <div id="main-view"></div>

    <!-- Bottom Chat Composer (Shown inside a Chat) -->
    <div id="composer" class="composer-bar" style="display:none;">
      <div id="reply-banner" class="reply-banner" style="display:none;">
        <span id="reply-text">Replying...</span>
        <span onclick="clearReply()" style="cursor:pointer;">[x]</span>
      </div>
      <div class="composer-row">
        <button class="mini-btn focusable" id="attach-btn" data-action="attach" title="Attach File/Media">+</button>
        <input type="text" id="msg-input" class="input-field focusable" placeholder="Press # or OK to type..." autocomplete="off" />
        <button class="mini-btn focusable" id="send-btn" data-action="send">Send</button>
      </div>
      <input type="file" id="file-picker" style="display:none;" />
    </div>

    <!-- Overlay Action Menu -->
    <div id="menu-overlay">
      <div class="menu-sheet" id="menu-sheet"></div>
    </div>

    <!-- Softkey Bar (LSK / Center OK / RSK) -->
    <div id="softkey-bar">
      <div class="sk-left" id="sk-left" onclick="triggerLSK()">* Menu</div>
      <div class="sk-center" id="sk-center" onclick="triggerCenter()">OK</div>
      <div class="sk-right" id="sk-right" onclick="triggerRSK()">Back</div>
    </div>
  </div>

  <script>
    /**************************************************************
     * STATE & STORAGE MANAGEMENT
     **************************************************************/
    const STORAGE_KEY = 'tg_cloudphone_240_v1';
    let savedConfig = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

    const state = {
      mode: savedConfig.mode || 'demo', // 'demo' | 'mtproto' | 'bot'
      screen: 'chatlist',               // 'chatlist' | 'chat' | 'login' | 'search' | 'contacts' | 'saved'
      tab: 'all',                       // 'all' | 'private' | 'groups' | 'channels'
      focusIndex: 0,
      menuOpen: false,
      menuFocusIndex: 0,
      activeChatId: null,
      replyToMsg: null,
      forwardMsg: null,
      apiId: savedConfig.apiId || '',
      apiHash: savedConfig.apiHash || '',
      phoneNumber: savedConfig.phoneNumber || '',
      botToken: savedConfig.botToken || '',
      tdClient: null,
      authStep: 'credentials',          // 'credentials' | 'code' | 'password'
      chats: [
        {
          id: 'saved',
          title: 'Saved Messages',
          type: 'private',
          tag: 'SAVED',
          avatar: 'SM',
          unread: 0,
          time: 'Now',
          messages: [
            { id: 1, sender: 'You', out: true, text: 'Welcome to TG Cloud 240 for itel Neo 4G+!', time: '12:00' },
            { id: 2, sender: 'You', out: true, text: 'Keys: Up/Down=Move, Enter=Select, *=Menu, #=Type, RSK=Back', time: '12:01' }
          ]
        },
        {
          id: 'c1',
          title: 'Ayesha Rahman',
          type: 'private',
          tag: 'USER',
          avatar: 'AR',
          unread: 2,
          time: '18:40',
          messages: [
            { id: 10, sender: 'Ayesha Rahman', out: false, text: 'Hey! Does Telegram work on your itel Neo 4G+?', time: '18:38' },
            { id: 11, sender: 'Ayesha Rahman', out: false, media: 'Photo (32 KB) - Sunset_Dhaka.jpg', text: 'Check out this photo!', time: '18:40' }
          ]
        },
        {
          id: 'g1',
          title: 'CloudPhone Devs BD',
          type: 'groups',
          tag: 'GRP',
          avatar: 'CP',
          unread: 5,
          time: '18:15',
          messages: [
            { id: 20, sender: 'Tanvir', out: false, text: '240x320 widgets run super fast on GitHub Pages.', time: '18:10' },
            { id: 21, sender: 'Rafiq', out: false, media: 'Voice Note (0:14)', text: 'Audio update on keypad shortcuts', time: '18:15' }
          ]
        },
        {
          id: 'ch1',
          title: 'Telegram Tech News',
          type: 'channels',
          tag: 'CH',
          avatar: 'TN',
          unread: 1,
          time: '16:00',
          messages: [
            { id: 30, sender: 'Tech News', out: false, text: 'Cloud Phone widgets now support full WebSocket MTProto connections.', time: '16:00' }
          ]
        },
        {
          id: 'c2',
          title: 'BotFather',
          type: 'private',
          tag: 'BOT',
          avatar: 'BF',
          unread: 0,
          time: 'Yesterday',
          messages: [
            { id: 40, sender: 'BotFather', out: false, text: 'Use /newbot to create a bot or connect your token in Menu -> Login.', time: 'Yesterday' }
          ]
        }
      ]
    };

    function saveStateConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        mode: state.mode,
        apiId: state.apiId,
        apiHash: state.apiHash,
        phoneNumber: state.phoneNumber,
        botToken: state.botToken
      }));
    }

    function showToast(msg, duration = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, duration);
    }

    /**************************************************************
     * CLOUD PHONE HISTORY / RIGHT SOFT KEY (RSK) MANAGEMENT
     **************************************************************/
    function pushNavState(screenName) {
      if (state.screen !== screenName) {
        history.pushState({ screen: screenName }, '');
      }
      state.screen = screenName;
      state.focusIndex = 0;
      render();
    }

    window.addEventListener('popstate', () => {
      if (state.menuOpen) {
        closeMenu();
        return;
      }
      if (state.screen !== 'chatlist') {
        state.screen = 'chatlist';
        state.activeChatId = null;
        state.replyToMsg = null;
        state.focusIndex = 0;
        render();
      }
    });

    /**************************************************************
     * VIEW RENDERING
     **************************************************************/
    function render() {
      const main = document.getElementById('main-view');
      const tabBar = document.getElementById('tab-bar');
      const composer = document.getElementById('composer');
      const headerTitle = document.getElementById('header-title');
      const headerMeta = document.getElementById('header-meta');
      const skLeft = document.getElementById('sk-left');
      const skCenter = document.getElementById('sk-center');
      const skRight = document.getElementById('sk-right');

      headerMeta.textContent = state.mode.toUpperCase();

      if (state.screen === 'chatlist') {
        tabBar.style.display = 'flex';
        composer.style.display = 'none';
        headerTitle.textContent = state.forwardMsg ? 'Select Chat to Fwd' : 'Telegram 240';
        skLeft.textContent = '* Menu';
        skCenter.textContent = 'Open';
        skRight.textContent = state.forwardMsg ? 'Cancel' : 'Exit';
        renderChatList(main);
      } else if (state.screen === 'chat') {
        tabBar.style.display = 'none';
        composer.style.display = 'flex';
        const chat = getActiveChat();
        headerTitle.textContent = chat ? chat.title : 'Chat';
        skLeft.textContent = '* Options';
        skCenter.textContent = 'Action';
        skRight.textContent = 'Back';
        renderChatView(main, chat);
      } else if (state.screen === 'login') {
        tabBar.style.display = 'none';
        composer.style.display = 'none';
        headerTitle.textContent = 'Connect Account';
        skLeft.textContent = '* Menu';
        skCenter.textContent = 'Select';
        skRight.textContent = 'Back';
        renderLoginView(main);
      } else if (state.screen === 'search') {
        tabBar.style.display = 'none';
        composer.style.display = 'none';
        headerTitle.textContent = 'Search & Join';
        skLeft.textContent = '* Menu';
        skCenter.textContent = 'Go';
        skRight.textContent = 'Back';
        renderSearchView(main);
      }

      updateFocus();
    }

    function renderChatList(container) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.tab);
      });

      const filtered = state.chats.filter(c => {
        if (state.tab === 'all') return true;
        return c.type === state.tab;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="form-box"><div class="form-help">No chats in this tab. Press * Menu to start a new chat or switch tabs with keys 1-4.</div></div>`;
        return;
      }

      container.innerHTML = filtered.map((c, idx) => {
        const lastMsg = c.messages[c.messages.length - 1];
        const preview = lastMsg
          ? (lastMsg.media ? `[${lastMsg.media}] ` : '') + (lastMsg.text || '')
          : 'No messages yet';
        return `
          <div class="chat-row focusable" data-action="open-chat" data-id="${c.id}" data-idx="${idx}">
            <div class="avatar">${escapeHtml(c.avatar || c.title.slice(0,2).toUpperCase())}</div>
            <div class="chat-info">
              <div class="chat-top">
                <div class="chat-title"><span class="type-tag">${c.tag}</span>${escapeHtml(c.title)}</div>
                <div class="chat-time">${escapeHtml(c.time || '')}</div>
              </div>
              <div class="chat-bottom">
                <div class="chat-preview">${escapeHtml(preview)}</div>
                ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('.chat-row').forEach(row => {
        row.addEventListener('click', () => openChat(row.dataset.id));
      });
    }

    function renderChatView(container, chat) {
      if (!chat) return;
      const replyBanner = document.getElementById('reply-banner');
      const replyText = document.getElementById('reply-text');
      if (state.replyToMsg) {
        replyBanner.style.display = 'flex';
        replyText.textContent = `Reply: ${state.replyToMsg.text.slice(0, 22)}...`;
      } else {
        replyBanner.style.display = 'none';
      }

      container.innerHTML = `
        <div class="msg-list">
          ${chat.messages.map((m, idx) => `
            <div class="msg-item ${m.out ? 'out' : ''} focusable" data-action="msg-options" data-mid="${m.id}" data-idx="${idx}">
              ${!m.out ? `<div class="msg-sender">${escapeHtml(m.sender)}</div>` : ''}
              ${m.replyTo ? `<div class="msg-reply-box">${escapeHtml(m.replyTo)}</div>` : ''}
              ${m.media ? `<div class="msg-media-box">&#128206; ${escapeHtml(m.media)}</div>` : ''}
              <div class="msg-text">${escapeHtml(m.text)}</div>
              <div class="msg-footer">
                ${m.react ? `<span>${m.react}</span>` : ''}
                <span>${escapeHtml(m.time)}${m.out ? '&#10003;&#10003;' : ''}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      container.querySelectorAll('.msg-item').forEach(el => {
        el.addEventListener('click', () => openMessageContextMenu(Number(el.dataset.mid)));
      });

      // Default focus to last message or input
      const focusables = getFocusables();
      if (state.focusIndex >= focusables.length) {
        state.focusIndex = Math.max(0, focusables.length - 2);
      }
    }

    function renderLoginView(container) {
      container.innerHTML = `
        <div class="form-box">
          <div class="form-label">1. Full Telegram Account (MTProto/TDWeb)</div>
          <div class="form-help">Get free API ID & Hash from my.telegram.org</div>
          <input id="in-api-id" class="input-field focusable" placeholder="API ID (e.g. 123456)" value="${escapeHtml(state.apiId)}" />
          <input id="in-api-hash" class="input-field focusable" placeholder="API Hash" value="${escapeHtml(state.apiHash)}" />
          <input id="in-phone" class="input-field focusable" placeholder="Phone (+8801XXXXXXXXX)" value="${escapeHtml(state.phoneNumber)}" />

          ${state.authStep === 'code' ? `
            <input id="in-code" class="input-field focusable" placeholder="Enter 5-digit SMS/TG OTP Code" />
            <button class="btn-block focusable" data-action="submit-code">Verify OTP Code</button>
          ` : state.authStep === 'password' ? `
            <input id="in-pass" type="password" class="input-field focusable" placeholder="2FA Cloud Password" />
            <button class="btn-block focusable" data-action="submit-2fa">Submit 2FA Password</button>
          ` : `
            <button class="btn-block focusable" data-action="start-mtproto">Send Login Code (MTProto)</button>
          `}

          <hr style="border:0; border-top:1px solid var(--border); margin:4px 0;" />

          <div class="form-label">2. Quick Bot / Channel Bridge</div>
          <input id="in-bot-token" class="input-field focusable" placeholder="Bot Token (12345:AAH...)" value="${escapeHtml(state.botToken)}" />
          <button class="btn-block secondary focusable" data-action="start-bot">Connect Bot API</button>

          <button class="btn-block secondary focusable" data-action="use-demo">Use Demo / Sandbox Mode</button>
        </div>
      `;
    }

    function renderSearchView(container) {
      container.innerHTML = `
        <div class="form-box">
          <div class="form-label">Search Chats or Join @Username</div>
          <input id="in-search" class="input-field focusable" placeholder="Type name or @channel..." />
          <button class="btn-block focusable" data-action="exec-search">Search / Open @Username</button>
          <div class="form-label" style="margin-top:4px;">Create New Group / Channel</div>
          <input id="in-new-title" class="input-field focusable" placeholder="New Group or Channel Name" />
          <button class="btn-block secondary focusable" data-action="create-group">+ Create Group / Channel</button>
        </div>
      `;
    }

    /**************************************************************
     * ACTIONS & CHAT LOGIC
     **************************************************************/
    function getActiveChat() {
      return state.chats.find(c => c.id === state.activeChatId);
    }

    function switchTab(tabName) {
      state.tab = tabName;
      state.focusIndex = 0;
      render();
    }

    function openChat(chatId) {
      const target = state.chats.find(c => c.id === chatId);
      if (!target) return;

      if (state.forwardMsg) {
        const now = new Date().toTimeString().slice(0, 5);
        target.messages.push({
          id: Date.now(),
          sender: 'You (Forwarded)',
          out: true,
          text: `[Fwd] ${state.forwardMsg.text}`,
          media: state.forwardMsg.media || null,
          time: now
        });
        target.time = now;
        state.forwardMsg = null;
        showToast(`Forwarded to ${target.title}`);
      }

      target.unread = 0;
      state.activeChatId = chatId;
      pushNavState('chat');
      const focusables = getFocusables();
      state.focusIndex = Math.max(0, focusables.length - 3);
      updateFocus();
    }

    async function sendCurrentMessage() {
      const input = document.getElementById('msg-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      const chat = getActiveChat();
      if (!chat) return;

      const now = new Date().toTimeString().slice(0, 5);
      const newMsg = {
        id: Date.now(),
        sender: 'You',
        out: true,
        text: text,
        replyTo: state.replyToMsg ? state.replyToMsg.text : null,
        time: now
      };

      chat.messages.push(newMsg);
      chat.time = now;
      input.value = '';
      state.replyToMsg = null;

      // Send over live MTProto if connected
      if (state.mode === 'mtproto' && state.tdClient && typeof chat.id === 'number') {
        try {
          await state.tdClient.send({
            '@type': 'sendMessage',
            chat_id: chat.id,
            input_message_content: {
              '@type': 'inputMessageText',
              text: { '@type': 'formattedText', text: text }
            }
          });
        } catch (err) {
          showToast('MTProto send queued');
        }
      } else if (state.mode === 'bot' && state.botToken && chat.chatId) {
        try {
          await fetch(`https://api.telegram.org/bot${state.botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chat.chatId, text: text })
          });
        } catch (e) {
          showToast('Bot API error');
        }
      } else if (state.mode === 'demo' && chat.id !== 'saved') {
        setTimeout(() => {
          chat.messages.push({
            id: Date.now() + 1,
            sender: chat.title,
            out: false,
            text: `Received: "${text}" on 240x320 Cloud Phone!`,
            time: new Date().toTimeString().slice(0, 5)
          });
          if (state.screen === 'chat' && state.activeChatId === chat.id) render();
        }, 900);
      }

      render();
    }

    function clearReply() {
      state.replyToMsg = null;
      render();
    }

    // File / Media Picker Handler
    document.getElementById('file-picker').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const chat = getActiveChat();
      if (!chat) return;
      const kb = Math.max(1, Math.round(file.size / 1024));
      const now = new Date().toTimeString().slice(0, 5);
      chat.messages.push({
        id: Date.now(),
        sender: 'You',
        out: true,
        media: `${file.name} (${kb} KB)`,
        text: 'Sent attachment',
        time: now
      });
      showToast(`Sent: ${file.name}`);
      render();
    });

    /**************************************************************
     * REAL TELEGRAM MTPROTO (TDWEB) & BOT API INTEGRATION
     **************************************************************/
    async function startMTProtoLogin() {
      const apiId = document.getElementById('in-api-id').value.trim();
      const apiHash = document.getElementById('in-api-hash').value.trim();
      const phone = document.getElementById('in-phone').value.trim();

      if (!apiId || !apiHash || !phone) {
        showToast('Enter API ID, Hash & Phone');
        return;
      }

      state.apiId = apiId;
      state.apiHash = apiHash;
      state.phoneNumber = phone;
      saveStateConfig();

      if (!window.tdweb) {
        showToast('Loading TDLib WASM...');
        return;
      }

      showToast('Connecting to Telegram DC...');
      try {
        const TdClient = window.tdweb.default || window.tdweb;
        state.tdClient = new TdClient({
          useTestDC: false,
          readOnly: false,
          verbosity: 1,
          jsLogVerbosityLevel: 'error',
          fastUpdating: true,
          useDatabase: true,
          mode: 'wasm'
        });

        state.tdClient.onUpdate = async (update) => {
          if (update['@type'] === 'updateAuthorizationState') {
            const authType = update.authorization_state['@type'];
            if (authType === 'authorizationStateWaitTdlibParameters') {
              await state.tdClient.send({
                '@type': 'setTdlibParameters',
                parameters: {
                  '@type': 'tdParameters',
                  use_test_dc: false,
                  api_id: Number(state.apiId),
                  api_hash: state.apiHash,
                  system_language_code: 'en',
                  device_model: 'itel Neo 4G+ CloudPhone',
                  system_version: 'CloudPhone QVGA',
                  application_version: '1.0',
                  use_secret_chats: false,
                  use_message_database: true,
                  use_file_database: false
                }
              });
            } else if (authType === 'authorizationStateWaitEncryptionKey') {
              await state.tdClient.send({ '@type': 'checkDatabaseEncryptionKey', encryption_key: '' });
            } else if (authType === 'authorizationStateWaitPhoneNumber') {
              await state.tdClient.send({
                '@type': 'setAuthenticationPhoneNumber',
                phone_number: state.phoneNumber
              });
            } else if (authType === 'authorizationStateWaitCode') {
              state.authStep = 'code';
              showToast('OTP sent! Enter code.');
              render();
            } else if (authType === 'authorizationStateWaitPassword') {
              state.authStep = 'password';
              showToast('Enter 2FA Password');
              render();
            } else if (authType === 'authorizationStateReady') {
              state.mode = 'mtproto';
              state.authStep = 'credentials';
              saveStateConfig();
              showToast('Logged into Telegram!');
              await loadMTProtoChats();
              pushNavState('chatlist');
            }
          } else if (update['@type'] === 'updateNewMessage') {
            handleIncomingMTProtoMessage(update.message);
          }
        };
      } catch (err) {
        showToast('TDWeb Init Error: Check API ID/Hash');
      }
    }

    async function submitMTProtoCode() {
      const code = document.getElementById('in-code')?.value.trim();
      if (!code || !state.tdClient) return;
      try {
        await state.tdClient.send({ '@type': 'checkAuthenticationCode', code });
      } catch (e) {
        showToast('Invalid OTP code');
      }
    }

    async function submitMTProto2FA() {
      const password = document.getElementById('in-pass')?.value;
      if (!password || !state.tdClient) return;
      try {
        await state.tdClient.send({ '@type': 'checkAuthenticationPassword', password });
      } catch (e) {
        showToast('Invalid 2FA password');
      }
    }

    async function loadMTProtoChats() {
      if (!state.tdClient) return;
      try {
        const res = await state.tdClient.send({ '@type': 'getChats', chat_list: { '@type': 'chatListMain' }, limit: 30 });
        if (res && res.chat_ids) {
          const loaded = [];
          for (const cid of res.chat_ids.slice(0, 20)) {
            const c = await state.tdClient.send({ '@type': 'getChat', chat_id: cid });
            loaded.push({
              id: c.id,
              title: c.title || 'Chat',
              type: c.type['@type'] === 'chatTypePrivate' ? 'private' : (c.type['@type'] === 'chatTypeBasicGroup' ? 'groups' : 'channels'),
              tag: c.type['@type'] === 'chatTypePrivate' ? 'USER' : 'GRP',
              avatar: (c.title || 'TG').slice(0, 2).toUpperCase(),
              unread: c.unread_count || 0,
              time: 'Live',
              messages: []
            });
          }
          if (loaded.length > 0) state.chats = loaded;
        }
      } catch (e) {}
    }

    function handleIncomingMTProtoMessage(msg) {
      const chat = state.chats.find(c => c.id === msg.chat_id);
      if (!chat) return;
      const txt = msg.content?.text?.text || '[Media/Service Message]';
      chat.messages.push({
        id: msg.id,
        sender: msg.is_outgoing ? 'You' : chat.title,
        out: !!msg.is_outgoing,
        text: txt,
        time: new Date().toTimeString().slice(0, 5)
      });
      if (!msg.is_outgoing) chat.unread = (chat.unread || 0) + 1;
      render();
    }

    async function startBotMode() {
      const token = document.getElementById('in-bot-token')?.value.trim();
      if (!token) {
        showToast('Enter a valid Bot Token');
        return;
      }
      showToast('Checking Bot Token...');
      try {
        const res = await fetch(`https://api.telegram.org/bot${token}/getMe`).then(r => r.json());
        if (!res.ok) throw new Error('Invalid token');
        state.botToken = token;
        state.mode = 'bot';
        saveStateConfig();

        const updates = await fetch(`https://api.telegram.org/bot${token}/getUpdates?limit=25`).then(r => r.json());
        const map = new Map();
        (updates.result || []).forEach(u => {
          const m = u.message || u.channel_post;
          if (!m || !m.chat) return;
          const cid = String(m.chat.id);
          if (!map.has(cid)) {
            map.set(cid, {
              id: cid,
              chatId: m.chat.id,
              title: m.chat.title || m.chat.first_name || m.chat.username || cid,
              type: m.chat.type === 'private' ? 'private' : (m.chat.type === 'channel' ? 'channels' : 'groups'),
              tag: m.chat.type.slice(0, 3).toUpperCase(),
              avatar: (m.chat.title || m.chat.first_name || 'BT').slice(0, 2).toUpperCase(),
              unread: 0,
              time: 'Bot',
              messages: []
            });
          }
          map.get(cid).messages.push({
            id: m.message_id,
            sender: m.from?.first_name || 'User',
            out: false,
            text: m.text || m.caption || '[Attachment]',
            time: 'Live'
          });
        });

        if (map.size > 0) state.chats = Array.from(map.values());
        showToast(`Connected: @${res.result.username}`);
        pushNavState('chatlist');
      } catch (e) {
        showToast('Bot connect failed');
      }
    }

    /**************************************************************
     * POPUP MENUS (LEFT SOFTKEY & MESSAGE ACTIONS)
     **************************************************************/
    let currentMenuItems = [];

    function openMenu(title, items) {
      currentMenuItems = items;
      state.menuOpen = true;
      state.menuFocusIndex = 0;
      const overlay = document.getElementById('menu-overlay');
      const sheet = document.getElementById('menu-sheet');
      sheet.innerHTML = `
        <div class="menu-header">${escapeHtml(title)}</div>
        ${items.map((item, i) => `
          <div class="menu-option focusable ${i === 0 ? 'focused' : ''}" data-midx="${i}">
            <span>${escapeHtml(item.label)}</span>
            <span class="menu-key">${i + 1}</span>
          </div>
        `).join('')}
      `;
      sheet.querySelectorAll('.menu-option').forEach(el => {
        el.addEventListener('click', () => {
          const idx = Number(el.dataset.midx);
          const chosen = currentMenuItems[idx];
          closeMenu();
          if (chosen && chosen.action) chosen.action();
        });
      });
      overlay.classList.add('open');
      document.getElementById('sk-right').textContent = 'Close';
    }

    function closeMenu() {
      state.menuOpen = false;
      document.getElementById('menu-overlay').classList.remove('open');
      render();
    }

    function openMainMenu() {
      openMenu('Main Menu (*)', [
        { label: 'Login / Connect Account', action: () => pushNavState('login') },
        { label: 'Search / New Group / @Join', action: () => pushNavState('search') },
        { label: 'Saved Messages (Cloud)', action: () => openChat('saved') },
        { label: 'Refresh Messages', action: () => { if (state.mode === 'bot') startBotMode(); else showToast('Synced!'); } },
        { label: 'Keypad Shortcuts Help', action: () => showToast('1-4:Tabs | *:Menu | #:Write | OK:Open', 3500) }
      ]);
    }

    function openMessageContextMenu(msgId) {
      const chat = getActiveChat();
      if (!chat) return;
      const msg = chat.messages.find(m => m.id === msgId);
      if (!msg) return;

      openMenu('Message Options', [
        {
          label: 'Reply to Message',
          action: () => {
            state.replyToMsg = msg;
            render();
            document.getElementById('msg-input')?.focus();
          }
        },
        {
          label: 'React 👍 / ❤️ / 🔥',
          action: () => {
            const reactions = ['👍', '❤️', '🔥', '😂'];
            msg.react = reactions[(reactions.indexOf(msg.react) + 1) % reactions.length];
            render();
          }
        },
        {
          label: 'Forward to Another Chat',
          action: () => {
            state.forwardMsg = msg;
            pushNavState('chatlist');
            showToast('Select chat to forward message');
          }
        },
        {
          label: 'Copy Message Text',
          action: () => {
            navigator.clipboard?.writeText(msg.text || '');
            showToast('Copied to clipboard');
          }
        },
        {
          label: 'Delete Message',
          action: () => {
            chat.messages = chat.messages.filter(m => m.id !== msgId);
            showToast('Message deleted');
            render();
          }
        }
      ]);
    }

    /**************************************************************
     * FEATURE PHONE D-PAD & KEYPAD CONTROLLER
     **************************************************************/
    function getFocusables() {
      if (state.menuOpen) {
        return Array.from(document.querySelectorAll('#menu-sheet .menu-option'));
      }
      return Array.from(document.querySelectorAll('#main-view .focusable, #composer .focusable'));
    }

    function updateFocus() {
      const list = getFocusables();
      if (list.length === 0) return;

      if (state.menuOpen) {
        state.menuFocusIndex = Math.max(0, Math.min(state.menuFocusIndex, list.length - 1));
        list.forEach((el, idx) => el.classList.toggle('focused', idx === state.menuFocusIndex));
        list[state.menuFocusIndex]?.scrollIntoView({ block: 'nearest' });
      } else {
        state.focusIndex = Math.max(0, Math.min(state.focusIndex, list.length - 1));
        list.forEach((el, idx) => el.classList.toggle('focused', idx === state.focusIndex));
        const active = list[state.focusIndex];
        if (active) {
          active.scrollIntoView({ block: 'nearest' });
          if (active.tagName === 'INPUT') active.focus();
          else document.activeElement?.blur?.();
        }
      }
    }

    function triggerLSK() {
      if (state.menuOpen) {
        closeMenu();
        return;
      }
      openMainMenu();
    }

    function triggerRSK() {
      if (state.menuOpen) {
        closeMenu();
        return;
      }
      if (state.forwardMsg) {
        state.forwardMsg = null;
        render();
        return;
      }
      if (state.screen !== 'chatlist') {
        history.back();
      } else {
        window.close();
      }
    }

    function triggerCenter() {
      const list = getFocusables();
      const idx = state.menuOpen ? state.menuFocusIndex : state.focusIndex;
      const el = list[idx];
      if (!el) return;

      if (state.menuOpen) {
        el.click();
        return;
      }

      const action = el.dataset.action;
      if (action === 'open-chat') {
        openChat(el.dataset.id);
      } else if (action === 'msg-options') {
        openMessageContextMenu(Number(el.dataset.mid));
      } else if (action === 'send') {
        sendCurrentMessage();
      } else if (action === 'attach') {
        document.getElementById('file-picker').click();
      } else if (action === 'start-mtproto') {
        startMTProtoLogin();
      } else if (action === 'submit-code') {
        submitMTProtoCode();
      } else if (action === 'submit-2fa') {
        submitMTProto2FA();
      } else if (action === 'start-bot') {
        startBotMode();
      } else if (action === 'use-demo') {
        state.mode = 'demo';
        saveStateConfig();
        pushNavState('chatlist');
        showToast('Demo Mode Active');
      } else if (action === 'exec-search') {
        const q = document.getElementById('in-search')?.value.trim();
        if (!q) return;
        const existing = state.chats.find(c => c.title.toLowerCase().includes(q.toLowerCase()));
        if (existing) {
          openChat(existing.id);
        } else {
          const newId = 'u_' + Date.now();
          state.chats.unshift({
            id: newId,
            title: q.startsWith('@') ? q : '@' + q,
            type: 'channels',
            tag: 'CH',
            avatar: q.replace('@','').slice(0,2).toUpperCase(),
            unread: 0,
            time: 'New',
            messages: [{ id: Date.now(), sender: q, out: false, text: `Joined ${q}`, time: 'Now' }]
          });
          openChat(newId);
        }
      } else if (action === 'create-group') {
        const title = document.getElementById('in-new-title')?.value.trim();
        if (!title) return;
        const newId = 'g_' + Date.now();
        state.chats.unshift({
          id: newId,
          title: title,
          type: 'groups',
          tag: 'GRP',
          avatar: title.slice(0,2).toUpperCase(),
          unread: 0,
          time: 'Now',
          messages: [{ id: Date.now(), sender: 'System', out: false, text: `Group "${title}" created.`, time: 'Now' }]
        });
        openChat(newId);
      } else if (el.tagName === 'INPUT') {
        el.focus();
      }
    }

    // Hardware Keypad Listener for itel Neo 4G+ / CloudPhone
    window.addEventListener('keydown', (e) => {
      const isTyping = document.activeElement && document.activeElement.tagName === 'INPUT';

      // Handle Enter on text input in chat composer
      if (isTyping && e.key === 'Enter' && document.activeElement.id === 'msg-input') {
        e.preventDefault();
        sendCurrentMessage();
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (state.menuOpen) state.menuFocusIndex++;
        else state.focusIndex++;
        updateFocus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.menuOpen) state.menuFocusIndex--;
        else state.focusIndex--;
        updateFocus();
      } else if (!isTyping && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.screen === 'chatlist' && !state.menuOpen) {
        e.preventDefault();
        const tabs = ['all', 'private', 'groups', 'channels'];
        const cur = tabs.indexOf(state.tab);
        const next = e.key === 'ArrowRight' ? (cur + 1) % tabs.length : (cur - 1 + tabs.length) % tabs.length;
        switchTab(tabs[next]);
      } else if (e.key === 'Enter') {
        if (!isTyping) {
          e.preventDefault();
          triggerCenter();
        }
      } else if (!isTyping && (e.key === '*' || e.key === 'SoftLeft' || e.key === 'F1')) {
        e.preventDefault();
        triggerLSK();
      } else if (!isTyping && (e.key === 'Escape' || e.key === 'SoftRight' || e.key === 'F2' || e.key === 'Backspace')) {
        e.preventDefault();
        triggerRSK();
      } else if (!isTyping && e.key === '#' && state.screen === 'chat') {
        e.preventDefault();
        const list = getFocusables();
        const inputIdx = list.findIndex(el => el.id === 'msg-input');
        if (inputIdx !== -1) {
          state.focusIndex = inputIdx;
          updateFocus();
        }
      } else if (!isTyping && state.menuOpen && e.key >= '1' && e.key <= '9') {
        const idx = Number(e.key) - 1;
        if (currentMenuItems[idx]) {
          e.preventDefault();
          const chosen = currentMenuItems[idx];
          closeMenu();
          chosen.action();
        }
      } else if (!isTyping && state.screen === 'chatlist' && !state.menuOpen && e.key >= '1' && e.key <= '4') {
        const tabs = ['all', 'private', 'groups', 'channels'];
        switchTab(tabs[Number(e.key) - 1]);
      }
    });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Boot App
    render();
  </script>
</body>
</html>
