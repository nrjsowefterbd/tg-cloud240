<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17212b">
  <title>TG Cloud 240</title>
  <style>
    :root{color-scheme:dark;--bg:#0e1621;--panel:#17212b;--item:#1f2c3a;--focus:#2b5278;--accent:#64b5ef;--muted:#8a9aa9;--border:#243447}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05080c;color:#f5f5f5;font:12px/1.3 Arial,sans-serif;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    #app{width:240px;height:320px;max-width:100vw;max-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
    #top{height:26px;flex:none;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 7px;border-bottom:1px solid var(--border);font-weight:bold;color:var(--accent)}
    #meta{font-size:9px;color:var(--muted)}#main{flex:1;overflow-y:auto;min-height:0;padding:6px}
    .hint{color:var(--muted);font-size:10px}.title{font-size:15px;font-weight:bold;margin:0 0 6px}
    .btn{display:block;width:100%;text-align:left;background:var(--item);border:1px solid var(--border);color:#fff;padding:9px 8px;margin:5px 0;border-radius:4px;font-size:12px}
    .btn:focus,.btn.selected,input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--focus)}
    input{display:block;width:100%;min-width:0;background:#0e1621;color:#fff;border:1px solid var(--border);padding:8px;margin:5px 0;border-radius:3px;font-size:12px}
    #keys{height:25px;flex:none;background:#090d14;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-weight:bold}
    #keys button{background:transparent;border:0;color:var(--accent);font-size:10px;padding:4px}
    #status{padding:6px;border:1px solid var(--border);background:var(--panel);font-size:10px;margin:6px 0;overflow-wrap:anywhere}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <main id="app" aria-label="TG Cloud 240">
    <header id="top"><span>✈ TG Cloud 240</span><span id="meta">LIVE WEB</span></header>
    <section id="main">
      <p class="title">Telegram for CloudPhone</p>
      <p>Small-screen launcher for your 240×320 feature phone.</p>
      <div id="status">The real Telegram web client opens in a separate page. This launcher does not collect your login details.</div>
      <button class="btn" id="open" autofocus>▶ Open real Telegram Web K</button>
      <button class="btn" id="compact">Open Telegram Web Z</button>
      <button class="btn" id="help">Keypad help</button>
      <p class="hint">Choose a client version. Sign in only on the official web.telegram.org domain.</p>
    </section>
    <footer id="keys"><button id="left">* Menu</button><button id="ok">OK / Open</button><button id="back">Back</button></footer>
  </main>
<script>
(function(){
 const items=Array.from(document.querySelectorAll('#main button'));
 let index=0;
 function focus(){index=(index+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('selected',i===index));items[index].focus({preventScroll:true});}
 function openUrl(url){window.open(url,'_blank','noopener');}
 items[0].onclick=()=>openUrl('https://web.telegram.org/k/');
 items[1].onclick=()=>openUrl('https://web.telegram.org/a/');
 items[2].onclick=()=>document.getElementById('status').textContent='Use Up/Down to select; Enter or OK to open; 1 opens Web K; 2 opens Web Z. Login takes place on official Telegram.';
 document.getElementById('ok').onclick=()=>items[index].click();
 document.getElementById('left').onclick=()=>{document.getElementById('status').textContent='Keypad: Up/Down move · Enter/OK select · 1 Web K · 2 Web Z · Back returns';};
 document.getElementById('back').onclick=()=>{try{history.back()}catch(e){}};
 window.addEventListener('keydown',e=>{
  if(['ArrowDown','ArrowUp','Enter',' ','1','2','Escape','Backspace','SoftLeft','SoftRight','F1','F2'].includes(e.key)) {
   if(e.key==='ArrowDown'){e.preventDefault();index++;focus()}
   else if(e.key==='ArrowUp'){e.preventDefault();index--;focus()}
   else if(e.key==='Enter'||e.key===' '){e.preventDefault();items[index].click()}
   else if(e.key==='1'){e.preventDefault();items[0].click()}
   else if(e.key==='2'){e.preventDefault();items[1].click()}
   else if(['Escape','Backspace','SoftRight','F2'].includes(e.key)){e.preventDefault();try{history.back()}catch(e){}}
   else if(['SoftLeft','F1'].includes(e.key)){e.preventDefault();document.getElementById('left').click()}
  }
 });
 focus();
})();
</script>
</body>
</html>
